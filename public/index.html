<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Balanz</title>
    <meta name="theme-color" content="#09090b" id="tema-color" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Controla tus gastos, ingresos y presupuestos." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Balanz" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" id="barra-estado" />
    <script>
      // Antes de pintar nada: la barra de arriba del móvil toma el color de la app (oscuro o claro), según lo elegido en
      // Más → Apariencia o, si es "Sistema", según el móvil. Así no queda una franja blanca sobre la app oscura.
      (function () {
        try {
          var p = {};
          try { p = JSON.parse(localStorage.getItem('balanz:accesibilidad') || '{}'); } catch (e) {}
          var oscuro = p.tema === 'oscuro' || (p.tema !== 'claro' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
          var fondo = p.altoContraste ? (oscuro ? '#000000' : '#ffffff') : (oscuro ? '#09090b' : '#f5f5f2');
          document.getElementById('barra-estado').setAttribute('content', oscuro ? 'black-translucent' : 'default');
          document.getElementById('tema-color').setAttribute('content', fondo);
          document.documentElement.style.backgroundColor = fondo;
        } catch (e) {}
      })();
    </script>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        /* Pegado a los cuatro bordes de la pantalla: así llega hasta abajo del todo, también en el iPhone instalado. */
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        flex: 1;
        box-sizing: border-box;
        /* Con la barra del móvil translúcida (modo oscuro), el contenido empieza justo debajo de ella. */
        padding-top: env(safe-area-inset-top);
      }
      input,
      textarea {
        font-size: 16px;
        outline: none;
      }
    </style>
  </head>

  <body>
    <noscript>Necesitas activar JavaScript para usar Balanz.</noscript>
    <div id="root"></div>
    <script>
      // iPhone con la app instalada: a veces iOS da a la página unos puntos menos que la pantalla y queda una franja negra
      // abajo. Aquí se le da a la app el alto real de la pantalla.
      (function () {
        var instalada = window.navigator.standalone === true; // solo existe en el iPhone/iPad
        if (!instalada) return;
        var raiz = document.getElementById('root');
        function ajustar() {
          var alto = Math.max(window.innerHeight, window.screen.height || 0);
          raiz.style.bottom = 'auto';
          raiz.style.height = alto + 'px';
        }
        ajustar();
        window.addEventListener('resize', ajustar);
        window.addEventListener('orientationchange', function () { setTimeout(ajustar, 200); });
      })();
    </script>
    <script>
      // Para poder abrir la app sin conexión (solo en HTTPS).
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
